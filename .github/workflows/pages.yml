name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site address into the link-preview tags
        run: node scripts/prepare.mjs
        env:
          SITE_URL: https://sainath31.github.io/rsvp
      - name: Generate calendar file for the static preview
        run: node scripts/gen-ics.mjs public/event.ics
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4
